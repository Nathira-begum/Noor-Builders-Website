<div class="calculator-container">
  <h2>Loan Amount Cost Calculator</h2>

  <div class="form-group">
    <label>Loan Amount (₹):</label>
    <input type="number" [(ngModel)]="loanAmount" placeholder="Enter Loan Amount">
  </div>

  <div class="form-group">
    <label>Interest Rate (% per annum):</label>
    <input type="number" [(ngModel)]="interestRate" placeholder="Enter Interest Rate">
  </div>

  <div class="form-group">
    <label>Tenure (months):</label>
    <input type="number" [(ngModel)]="tenure" placeholder="Enter Tenure in Months">
  </div>

  <button (click)="calculateEMI()">Calculate</button>

  <div class="results" *ngIf="emi > 0">
    <h3>Results</h3>
    <p><strong>Monthly EMI:</strong> ₹{{ emi | number:'1.2-2' }}</p>
    <p><strong>Total Interest:</strong> ₹{{ totalInterest | number:'1.2-2' }}</p>
    <p><strong>Total Payment:</strong> ₹{{ totalPayment | number:'1.2-2' }}</p>
  </div>
</div>
